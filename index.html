<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Human-to-alien translator</title>
        <link rel="stylesheet" href="./style.css">
    </head>

    <body>
        <h1>Human-to-alien translator</h1>

        <div id="translator">
            <!--<button class="round">⇄</button>-->

            <div id="cntr">
                <textarea
                    class="inputL"
                    id="inputHuman"
                    placeholder="Type words..."
                ></textarea>

                <textarea
                    class="inputL"
                    id="inputAlien"
                    readonly
                    placeholder="*dobamibane doga*"
                ></textarea>
            </div>
        </div>

        <script src="./script.js"></script>
    </body>
</html>
